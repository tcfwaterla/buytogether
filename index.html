<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區互動團購網</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div id="app" v-cloak class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">社區互動團購網</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-blue-500">
            <h2 class="text-xl font-semibold mb-4">📢 我要開團</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">團購活動名稱</label>
                    <input v-model="newGroup.title" placeholder="例如：好市多代購" class="w-full border p-2 rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">團購網址 (選填)</label>
                    <input v-model="newGroup.group_url" placeholder="http://" class="w-full border p-2 rounded">
                </div>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-bold text-gray-700 mb-1">團購詳細資訊 (例如：取貨地點、時間)</label>
                <textarea v-model="newGroup.description" rows="2" class="w-full border p-2 rounded" placeholder="請輸入團購規則或資訊..."></textarea>
            </div>

            <div class="mb-2 flex font-bold text-sm text-gray-500 bg-gray-50 p-2">
                <div class="flex-[2] px-1">產品名稱</div>
                <div class="flex-1 px-1">規格</div>
                <div class="w-20 px-1">單價</div>
                <div class="flex-1 px-1 text-xs md:text-sm">產品網址</div>
                <div class="w-10"></div>
            </div>

            <div v-for="(p, index) in newGroup.products" :key="index" class="flex items-center mb-2">
                <input v-model="p.name" class="flex-[2] border p-2 rounded-l w-full">
                <input v-model="p.spec" class="flex-1 border p-2 border-l-0 w-full">
                <input v-model.number="p.price" type="number" class="w-20 border p-2 border-l-0">
                <input v-model="p.link" class="flex-1 border p-2 border-l-0 w-full">
                <button @click="removeProduct(index)" class="w-10 bg-red-500 text-white p-2 rounded-r">✕</button>
            </div>

            <button @click="addProduct" class="text-blue-500 text-sm font-bold mb-6">+ 新增商品項目</button>
            
            <button @click="createGroup" :disabled="loading" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">
                {{ loading ? '開團處理中...' : '正式開團' }}
            </button>
        </div>

        <hr class="my-8">

        <h2 class="text-2xl font-bold mb-4 text-gray-700">🛒 進行中的團購</h2>
        
        <div v-for="group in groups" :key="group.id" class="bg-white p-6 rounded-lg shadow-md mb-8 border-l-4 border-green-500">
            <div class="flex justify-between items-start mb-2">
                <h3 class="text-2xl font-bold text-gray-800">{{ group.title }}</h3>
                <a v-if="group.group_url" :href="group.group_url" target="_blank" class="bg-blue-100 text-blue-600 px-3 py-1 rounded text-sm font-bold">查看參考網頁</a>
            </div>
            <p class="text-gray-600 mb-4 whitespace-pre-wrap bg-gray-50 p-3 rounded text-sm italic">{{ group.description || '暫無詳細資訊' }}</p>
            
            <div class="bg-blue-50 p-4 rounded-lg">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                    <input v-model="orderForm[group.id].name" placeholder="姓名" class="border p-2 rounded shadow-sm">
                    <input v-model="orderForm[group.id].phone" placeholder="電話" class="border p-2 rounded shadow-sm">
                    <input v-model="orderForm[group.id].unit" placeholder="戶別" class="border p-2 rounded shadow-sm">
                </div>

                <div class="space-y-2">
                    <div v-for="p in group.products" :key="p.name" class="flex justify-between items-center bg-white p-3 border rounded shadow-sm">
                        <div class="flex-1">
                            <span class="font-bold">{{ p.name }}</span>
                            <span class="text-sm text-gray-500 ml-2">({{ p.spec }})</span>
                            <a v-if="p.link" :href="p.link" target="_blank" class="block text-xs text-blue-400 mt-1 hover:underline">產品詳情</a>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-red-500 font-bold">${{ p.price }}</span>
                            <input type="number" v-model.number="orderForm[group.id].items[p.name]" min="0" class="w-16 border p-1 rounded text-center">
                        </div>
                    </div>
                </div>
                <button @click="submitOrder(group.id)" :disabled="loading" class="w-full bg-green-500 text-white py-3 rounded-lg mt-4 font-bold hover:bg-green-600">
                    送出訂單
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://uftrlttffbbsnmouwaax.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_2yxSuQdKlTYOrQ8QwxDBuQ_pKGhSmvl';
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        Vue.createApp({
            data() {
                return {
                    loading: false,
                    groups: [],
                    newGroup: { 
                        title: '', 
                        description: '', 
                        group_url: '',
                        products: [{ name: '', spec: '', price: 0, link: '' }] 
                    },
                    orderForm: {}
                }
            },
            methods: {
                addProduct() { this.newGroup.products.push({ name: '', spec: '', price: 0, link: '' }); },
                removeProduct(index) { if(this.newGroup.products.length > 1) this.newGroup.products.splice(index, 1); },
                async fetchGroups() {
                    const { data } = await _supabase.from('groups').select('*').order('created_at', { ascending: false });
                    this.groups = data || [];
                    this.groups.forEach(g => {
                        if (!this.orderForm[g.id]) this.orderForm[g.id] = { name: '', phone: '', unit: '', items: {} };
                    });
                },
                async createGroup() {
                    if (!this.newGroup.title) return alert('請填寫團購活動名稱');
                    this.loading = true;
                    const { error } = await _supabase.from('groups').insert([this.newGroup]);
                    if (error) {
                        alert('錯誤：' + error.message);
                    } else {
                        alert('開團成功！');
                        this.newGroup = { title: '', description: '', group_url: '', products: [{ name: '', spec: '', price: 0, link: '' }] };
                        this.fetchGroups();
                    }
                    this.loading = false;
                },
                async submitOrder(groupId) {
                    const form = this.orderForm[groupId];
                    if (!form.name || !form.phone) return alert('姓名與電話為必填');
                    this.loading = true;
                    const { error } = await _supabase.from('orders').insert([{
                        group_id: groupId, name: form.name, phone: form.phone, unit: form.unit, items: form.items
                    }]);
                    if (error) alert(error.message);
                    else {
                        alert('訂單已送出！');
                        this.orderForm[groupId].items = {};
                    }
                    this.loading = false;
                }
            },
            mounted() { if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') this.fetchGroups(); }
        }).mount('#app')
    </script>

    <style>[v-cloak] { display: none; }</style>
</body>
</html>
