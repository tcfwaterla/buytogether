<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區互動團購網</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div id="app" v-cloak class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">社區互動團購網</h1>

        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-blue-500">
            <h2 class="text-xl font-semibold mb-4 flex items-center">📢 我要開團</h2>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">團購活動名稱</label>
                <input v-model="newGroup.title" placeholder="例如：好市多草莓大福團" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-2 flex font-bold text-sm text-gray-500">
                <div class="flex-[2] px-1">產品名稱</div>
                <div class="flex-1 px-1">規格</div>
                <div class="w-20 px-1">單價</div>
                <div class="flex-1 px-1">參考網頁</div>
                <div class="w-10"></div>
            </div>

            <div v-for="(p, index) in newGroup.products" :key="index" class="flex items-center mb-3">
                <input v-model="p.name" placeholder="名稱" class="flex-[2] border p-2 rounded-l w-full">
                <input v-model="p.spec" placeholder="如:大盒" class="flex-1 border p-2 border-l-0 w-full">
                <input v-model.number="p.price" type="number" placeholder="0" class="w-20 border p-2 border-l-0">
                <input v-model="p.link" placeholder="http://" class="flex-1 border p-2 border-l-0 w-full">
                <button @click="removeProduct(index)" class="w-10 bg-red-500 text-white p-2 rounded-r hover:bg-red-600">✕</button>
            </div>

            <button @click="addProduct" class="text-blue-500 text-sm font-bold hover:underline cursor-pointer mb-6 inline-block">
                + 新增商品項目
            </button>
            
            <button @click="createGroup" :disabled="loading" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-blue-700 disabled:bg-gray-400">
                {{ loading ? '處理中...' : '正式開團' }}
            </button>
        </div>

        <hr class="my-8 border-gray-300">

        <h2 class="text-2xl font-bold mb-4 text-gray-700">🛒 進行中的團購</h2>
        <div v-if="groups.length === 0" class="text-center text-gray-500 py-10">目前尚無活動</div>
        
        <div v-for="group in groups" :key="group.id" class="bg-white p-6 rounded-lg shadow-md mb-6 border-l-4 border-green-500">
            <h3 class="text-2xl font-bold text-gray-800 mb-4">{{ group.title }}</h3>
            
            <div class="bg-gray-50 p-4 rounded-lg">
                <h4 class="font-bold mb-3 border-b pb-2 text-green-700">填寫訂購單：</h4>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-4">
                    <input v-model="orderForm[group.id].name" placeholder="姓名" class="border p-2 rounded">
                    <input v-model="orderForm[group.id].phone" placeholder="電話" class="border p-2 rounded">
                    <input v-model="orderForm[group.id].unit" placeholder="戶別 (如:A棟10F)" class="border p-2 rounded">
                </div>

                <div class="space-y-2">
                    <div v-for="p in group.products" :key="p.name" class="flex flex-wrap justify-between items-center bg-white p-3 border rounded shadow-sm">
                        <div class="flex-1">
                            <span class="font-bold text-lg text-gray-700">{{ p.name }}</span>
                            <span class="ml-2 text-sm text-gray-500">({{ p.spec || '無規格' }})</span>
                            <div class="text-blue-500 text-xs">
                                <a v-if="p.link" :href="p.link" target="_blank">🔗 點我查看參考網頁</a>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2 mt-2 md:mt-0">
                            <span class="text-red-500 font-bold">${{ p.price }}</span>
                            <input type="number" v-model.number="orderForm[group.id].items[p.name]" min="0" class="w-16 border p-1 rounded text-center font-bold">
                            <span class="text-gray-500 text-sm">份</span>
                        </div>
                    </div>
                </div>
                <button @click="submitOrder(group.id)" :disabled="loading" class="w-full bg-green-500 text-white py-3 rounded-lg mt-4 font-bold hover:bg-green-600 disabled:bg-gray-400">
                    確認送出訂單
                </button>
            </div>
        </div>
    </div>

    <style>[v-cloak] { display: none; }</style>

    <script>
        const { createClient } = supabase;
        // ！！！請在此處填入你的 Supabase 資訊 ！！！
        const SUPABASE_URL = 'https://uftrlttffbbsnmouwaax.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_2yxSuQdKlTYOrQ8QwxDBuQ_pKGhSmvl';

        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        Vue.createApp({
            data() {
                return {
                    loading: false,
                    groups: [],
                    newGroup: { 
                        title: '', 
                        products: [{ name: '', spec: '', price: 0, link: '' }] 
                    },
                    orderForm: {}
                }
            },
            methods: {
                addProduct() {
                    this.newGroup.products.push({ name: '', spec: '', price: 0, link: '' });
                },
                removeProduct(index) {
                    if(this.newGroup.products.length > 1) this.newGroup.products.splice(index, 1);
                },
                async fetchGroups() {
                    try {
                        const { data, error } = await _supabase.from('groups').select('*').order('created_at', { ascending: false });
                        if (error) throw error;
                        this.groups = data || [];
                        this.groups.forEach(g => {
                            if (!this.orderForm[g.id]) {
                                this.orderForm[g.id] = { name: '', phone: '', unit: '', items: {} };
                            }
                        });
                    } catch (err) {
                        console.error('讀取失敗:', err.message);
                    }
                },
                async createGroup() {
                    if (!this.newGroup.title) return alert('請填寫團購活動名稱');
                    this.loading = true;
                    try {
                        const { error } = await _supabase.from('groups').insert([this.newGroup]);
                        if (error) throw error;
                        alert('開團成功！');
                        this.newGroup = { title: '', products: [{ name: '', spec: '', price: 0, link: '' }] };
                        await this.fetchGroups();
                    } catch (err) {
                        alert('開團失敗，請檢查 Supabase 設定：' + err.message);
                    } finally {
                        this.loading = false;
                    }
                },
                async submitOrder(groupId) {
                    const form = this.orderForm[groupId];
                    if (!form.name || !form.phone) return alert('姓名與電話為必填');
                    
                    const hasItems = Object.values(form.items).some(val => val > 0);
                    if (!hasItems) return alert('請至少選擇一項商品數量');

                    this.loading = true;
                    try {
                        const { error } = await _supabase.from('orders').insert([{
                            group_id: groupId,
                            name: form.name,
                            phone: form.phone,
                            unit: form.unit,
                            items: form.items
                        }]);
                        if (error) throw error;
                        alert('訂單已成功送出！');
                        this.orderForm[groupId] = { name: '', phone: '', unit: '', items: {} };
                    } catch (err) {
                        alert('送出失敗：' + err.message);
                    } finally {
                        this.loading = false;
                    }
                }
            },
            mounted() {
                if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
                    alert('尚未設定 Supabase 連線資訊，網頁將無法運作！');
                } else {
                    this.fetchGroups();
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
