<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區團購管理系統</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[v-cloak] { display: none; }</style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="app" v-cloak class="flex min-h-screen">
        <aside class="w-64 bg-slate-900 text-white flex-shrink-0 shadow-xl">
            <div class="p-6 text-xl font-bold border-b border-slate-700 text-blue-400">團購系統選單</div>
            <nav class="mt-4">
                <button @click="currentPage = 'create'" :class="{'bg-blue-600': currentPage === 'create'}" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition flex items-center">
                    <span class="mr-2">📢</span> 我要開團
                </button>
                <button @click="currentPage = 'list'; fetchGroups()" :class="{'bg-blue-600': currentPage === 'list'}" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition flex items-center">
                    <span class="mr-2">🛒</span> 進行中團購
                </button>
                <button @click="currentPage = 'manage'" :class="{'bg-blue-600': currentPage === 'manage'}" class="w-full text-left px-6 py-4 hover:bg-slate-800 transition flex items-center">
                    <span class="mr-2">⚙️</span> 管理團購
                </button>
            </nav>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            
            <section v-if="currentPage === 'create'">
                <h2 class="text-3xl font-bold mb-6">發起新活動</h2>
                <div class="bg-white p-8 rounded-xl shadow-md max-w-4xl border">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block font-bold mb-2">活動標題 *</label>
                            <input v-model="newGroup.title" placeholder="如：小農鮮奶團" class="w-full border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block font-bold mb-2 text-red-600">管理密碼 * (修改時需使用)</label>
                            <input type="password" v-model="newGroup.admin_password" placeholder="請設定 4-8 位密碼" class="w-full border p-3 rounded-lg border-red-200">
                        </div>
                        <div>
                            <label class="block font-bold mb-2">截止日期 *</label>
                            <input type="date" v-model="newGroup.deadline" class="w-full border p-3 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-bold mb-2">參考網址 (選填)</label>
                            <input v-model="newGroup.group_url" placeholder="https://..." class="w-full border p-3 rounded-lg">
                        </div>
                    </div>
                    <div class="mb-6">
                        <label class="block font-bold mb-2">團購詳細資訊 (如：取貨地點)</label>
                        <textarea v-model="newGroup.description" rows="3" class="w-full border p-3 rounded-lg" placeholder="請輸入說明..."></textarea>
                    </div>

                    <p class="font-bold mb-3">📦 設定商品：</p>
                    <div v-for="(p, i) in newGroup.products" :key="i" class="flex gap-2 mb-3 bg-gray-50 p-2 rounded">
                        <input v-model="p.name" placeholder="產品名稱" class="flex-grow border p-2 rounded">
                        <input v-model="p.spec" placeholder="規格" class="w-32 border p-2 rounded">
                        <input v-model.number="p.price" type="number" placeholder="單價" class="w-24 border p-2 rounded">
                        <button @click="newGroup.products.splice(i, 1)" v-if="newGroup.products.length > 1" class="bg-red-500 text-white px-4 rounded">✕</button>
                    </div>
                    <button @click="newGroup.products.push({name:'',spec:'',price:0})" class="text-blue-600 font-bold mb-8">+ 新增商品</button>
                    
                    <button @click="createGroup" :disabled="loading" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-blue-700 disabled:bg-gray-400">
                        {{ loading ? '開團中...' : '確認發起團購' }}
                    </button>
                </div>
            </section>

            <section v-if="currentPage === 'list'">
                <h2 class="text-3xl font-bold mb-6">進行中的活動</h2>
                <div v-if="groups.length === 0" class="text-center py-20 text-gray-500">目前沒有活動，請先點擊左側「我要開團」</div>

                <div v-for="g in groups" :key="g.id" class="bg-white p-6 rounded-xl shadow-md border mb-8 border-l-8 border-blue-500">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-2xl font-bold text-gray-900">{{ g.title }}</h3>
                            <p class="text-red-500 font-bold mt-1">⏳ 截止日期：{{ g.deadline }}</p>
                        </div>
                        <button @click="exportCSV(g.id, g.title)" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-black transition">
                            📊 匯出 CSV (Excel 對帳單)
                        </button>
                    </div>
                    <div class="bg-gray-50 p-3 rounded mb-6 italic text-sm text-gray-600">{{ g.description }}</div>

                    <div class="bg-blue-50 p-5 rounded-lg mb-6 border border-blue-100">
                        <h4 class="font-bold text-blue-800 mb-4">✍️ 我要參團：</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <input v-model="orderForm[g.id].name" placeholder="姓名" class="border p-2 rounded shadow-sm">
                            <input v-model="orderForm[g.id].phone" placeholder="電話" class="border p-2 rounded shadow-sm">
                            <input v-model="orderForm[g.id].unit" placeholder="戶別" class="border p-2 rounded shadow-sm">
                        </div>
                        <div v-for="p in g.products" class="flex justify-between items-center bg-white p-3 rounded mb-2 shadow-sm border border-gray-100">
                            <span>{{ p.name }} <small class="text-gray-400">({{ p.spec }})</small> <b class="ml-2 text-red-500">${{ p.price }}</b></span>
                            <input type="number" v-model.number="orderForm[g.id].items[p.name]" min="0" class="w-20 border text-center rounded p-1 font-bold border-blue-200">
                        </div>
                        <button @click="submitOrder(g.id)" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold mt-2 hover:bg-green-700 shadow-md">送出訂單</button>
                    </div>

                    <div class="border-t pt-4">
                        <p class="font-bold mb-3 text-gray-700">📋 已登記名單 (請確認資料是否存入)：</p>
                        <table class="w-full text-sm border rounded overflow-hidden shadow-sm">
                            <thead class="bg-gray-100">
                                <tr><th class="p-2 border">姓名</th><th class="p-2 border">戶別</th><th class="p-2 border">內容</th></tr>
                            </thead>
                            <tbody>
                                <tr v-for="o in orders.filter(x => x.group_id === g.id)" class="hover:bg-gray-50 transition">
                                    <td class="p-2 border font-medium">{{ o.name }}</td>
                                    <td class="p-2 border text-gray-600">{{ o.unit }}</td>
                                    <td class="p-2 border text-blue-600">
                                        <span v-for="(qty, item) in o.items" v-show="qty > 0">【{{ item }} x {{ qty }}】</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section v-if="currentPage === 'manage'">
                <h2 class="text-3xl font-bold mb-6">活動後台管理</h2>
                <div v-for="g in groups" :key="g.id" class="bg-white p-6 rounded-lg shadow-sm border mb-4 flex flex-col md:flex-row justify-between items-center">
                    <div>
                        <span class="font-bold text-lg text-slate-700">{{ g.title }}</span>
                        <span class="ml-4 text-xs text-gray-400">ID: {{ g.id }}</span>
                    </div>
                    <button @click="startEdit(g)" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 transition">修改內容</button>

                    <div v-if="editingId === g.id" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
                        <div class="bg-white p-8 rounded-2xl w-full max-w-lg shadow-2xl animate-in fade-in zoom-in duration-300">
                            <h3 class="text-2xl font-bold mb-6">🔧 編輯活動資料</h3>
                            <div class="mb-6">
                                <label class="block text-sm font-bold text-red-600 mb-2">請輸入管理密碼驗證：</label>
                                <input type="password" v-model="editPassword" class="border-2 border-red-100 p-3 w-full rounded-lg focus:border-red-500 outline-none">
                            </div>
                            <div class="mb-4">
                                <label class="block text-sm font-bold mb-2">活動標題：</label>
                                <input v-model="editData.title" class="border p-3 w-full rounded-lg">
                            </div>
                            <div class="mb-6">
                                <label class="block text-sm font-bold mb-2">詳細說明：</label>
                                <textarea v-model="editData.description" rows="4" class="border p-3 w-full rounded-lg"></textarea>
                            </div>
                            <div class="flex gap-4">
                                <button @click="saveEdit(g.id, g.admin_password)" class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">儲存變更</button>
                                <button @click="editingId = null" class="flex-1 bg-gray-200 py-3 rounded-xl font-bold">取消</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script>
        const { createClient } = supabase;
        const SUPABASE_URL = 'https://uftrlttffbbsnmouwaax.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_2yxSuQdKlTYOrQ8QwxDBuQ_pKGhSmvl';
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        Vue.createApp({
            data() {
                return {
                    currentPage: 'list',
                    loading: false,
                    groups: [],
                    orders: [],
                    newGroup: { title: '', description: '', deadline: '', group_url: '', admin_password: '', products: [{ name: '', spec: '', price: 0 }] },
                    orderForm: {},
                    editingId: null,
                    editData: {},
                    editPassword: ''
                }
            },
            methods: {
                async fetchGroups() {
                    const { data: g } = await _supabase.from('groups').select('*').order('created_at', { ascending: false });
                    this.groups = g || [];
                    this.groups.forEach(x => {
                        if (!this.orderForm[x.id]) this.orderForm[x.id] = { name: '', phone: '', unit: '', items: {} };
                    });
                    const { data: o } = await _supabase.from('orders').select('*').order('created_at', { ascending: true });
                    this.orders = o || [];
                },
                async createGroup() {
                    if (!this.newGroup.title || !this.newGroup.deadline || !this.newGroup.admin_password) return alert('標題、日期與密碼為必填項目');
                    this.loading = true;
                    const { error } = await _supabase.from('groups').insert([this.newGroup]);
                    if (error) alert('失敗：' + error.message);
                    else {
                        alert('✅ 開團成功！');
                        this.newGroup = { title: '', description: '', deadline: '', group_url: '', admin_password: '', products: [{ name: '', spec: '', price: 0 }] };
                        this.currentPage = 'list';
                        this.fetchGroups();
                    }
                    this.loading = false;
                },
                async submitOrder(groupId) {
                    const form = this.orderForm[groupId];
                    if (!form.name || !form.phone) return alert('姓名與電話為必填');
                    const { error } = await _supabase.from('orders').insert([{ group_id: groupId, ...form }]);
                    if (error) alert(error.message);
                    else {
                        alert('✅ 訂購成功！');
                        this.orderForm[groupId].items = {};
                        this.fetchGroups();
                    }
                },
                exportCSV(groupId, title) {
                    const groupOrders = this.orders.filter(o => o.group_id === groupId);
                    let csv = '姓名,電話,戶別,訂購詳細內容\n';
                    groupOrders.forEach(o => {
                        const items = Object.entries(o.items).filter(([k, v]) => v > 0).map(([k, v]) => `${k}(${v})`).join(' ');
                        csv += `"${o.name}","${o.phone}","${o.unit}","${items}"\n`;
                    });
                    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(blob);
                    link.download = `訂單明細_${title}.csv`;
                    link.click();
                },
                startEdit(group) {
                    this.editingId = group.id;
                    this.editData = { ...group };
                    this.editPassword = '';
                },
                async saveEdit(id, originalPwd) {
                    if (this.editPassword !== originalPwd) return alert('❌ 密碼錯誤！');
                    const { error } = await _supabase.from('groups').update({
                        title: this.editData.title,
                        description: this.editData.description
                    }).eq('id', id);
                    if (error) alert(error.message);
                    else {
                        alert('✅ 修改成功');
                        this.editingId = null;
                        this.fetchGroups();
                    }
                }
            },
            mounted() { this.fetchGroups(); }
        }).mount('#app')
    </script>
</body>
</html>
